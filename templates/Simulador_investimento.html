<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimento</title>
    <link rel="static/css/style.css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Simulador de Investimento</h1>

        <form action="/simulador_investimento" method="post">

            <label for="valor_investido">Valor a investir (R$):</label>
            <input type="number" id="valor_investido" name="valor_investido" min="1" required>
            <br><br>

            <label for="tempo">Tempo de investimento:</label>
            <input type="number" id="tempo" name="tempo" min="1" required>

            <select name="tempo_investimento" id="tempo_investimento">
                <option value="Meses">Meses</option>
                <option value="Anos">Anos</option>
            </select>
            <br><br>

            <label for="tipo_investimento">Tipo de investimento:</label>
            <select id="tipo_investimento" name="tipo_investimento" required>
                <option value="poupança">Poupança (6% a.a.)</option>
                <option value="cdb">CDB (10% a.a.)</option>
                <option value="cdi">CDI (15% a.a.)</option>
                <option value="tesouro_direto">Tesouro Direto (11% a.a.)</option>
                <option value="acoes">Ações (25% a.a.)</option>
            </select>
            <br><br>

            <input type="submit" value="Simular">
        </form>

        {% if valor_final %}
        <div class="resultado">
            <h2>Resultado</h2>
            <p>Valor final estimado: <strong>R$ {{ valor_final }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
