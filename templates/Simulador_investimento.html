<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1> 📊 Simulador de Investimentos 
            Nubank</h1>
            <p>Descubra o potencial do seu dinheiro!</p>
        <form class="form-simulador" action="/simulador_investimento" method="post">

            <div class="Valor_investido">
                <label class="fontes" for="valor_investido">Valor a investir (R$):</label>
                <input class="input-valor" type="number" id="valor_investido" name="valor_investido" min="1" required>
            </div>

            <div class="Temp_investimento">
                <label class="fontes" for="tempo">Tempo de investimento:</label>
                <div class="input-tempo">
                    <input class="input-investimentos" type="number" id="tempo" name="tempo" min="1" required>
                    <select class="select-field" name="tempo_investimento" id="tempo_investimento">
                        <option value="Meses">Meses</option>
                        <option value="Anos">Anos</option>
                    </select>
                </div>
            </div>

            <div class="tipo_investimento">
                <label class="fontes" for="tipo_investimento">Tipo de investimento:</label>
                <select class="select-fields" id="tipo_investimento" name="tipo_investimento" required>
                    <option value="poupança">Poupança (6% a.a.)</option>
                    <option value="cdb">CDB (10% a.a.)</option>
                    <option value="cdi">CDI (15% a.a.)</option>
                    <option value="tesouro_direto">Tesouro Direto (11% a.a.)</option>
                    <option value="acoes">Ações (25% a.a.)</option>
                </select>
            </div>

            <button class="btn-simular" type="submit">Simular Investimento</button>
        </form>

        {% if valor_final %}
        <div class="resultado">
            <h2>Resultado da Simulação</h2>
            <p>Valor final estimado: <strong>R$ {{ valor_final }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
